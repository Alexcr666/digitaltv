name: digitaltv
description: "Digital Signage Enterprise - TV Player App (Flutter Android TV)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Media (TV Player Core)
  video_player: ^2.8.3
  cached_network_image: ^3.3.1

  # Android TV / Kiosk Mode
  wakelock_plus: ^1.2.5
  android_intent_plus: ^4.0.3
  device_info_plus: ^10.1.0

  # Network / Connectivity
  connectivity_plus: ^6.0.3

  # Storage / Cache / Utils
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  flutter_cache_manager: ^3.3.1
  logger: ^2.3.0
  dartz: ^0.10.1
  equatable: ^2.0.8
  go_router: ^14.6.2
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  firebase_auth: ^4.20.0
  google_fonts: ^6.2.0
  file_picker: ^8.0.5
  image_picker: ^1.1.2
  cloud_functions: ^4.7.6
  firebase_storage: ^11.7.7
  fl_chart: ^0.71.0
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_positivo.png
    - assets/Mesa de trabajo 1.svg